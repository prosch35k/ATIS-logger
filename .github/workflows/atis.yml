name: Log ATIS

# Started every 5 minutes from cron-job.org (POST to the workflow_dispatch API).
# Each run checks atis.guru once and commits any new ATIS. Takes ~20 seconds.
# The hourly schedule is only a backup in case cron-job.org stops calling.

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: atis-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check ATIS once
        run: python3 atis_logger.py --once --airports ESSA ESGG --logdir atis_logs

      - name: Commit new ATIS (only if something changed)
        run: |
          git config user.name  "atis-logger"
          git config user.email "atis-logger@users.noreply.github.com"
          git add atis_logs
          if git diff --cached --quiet; then
            echo "No new ATIS."
          else
            git commit -m "New ATIS $(date -u '+%Y-%m-%d %H:%MZ')"
            git pull --rebase --quiet
            git push
          fi
